name: Owner Approval Required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [Tests]
    types: [completed]

jobs:
  # Gate 1: did the Tests workflow pass on this PR's head commit?
  tests-result:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.head_branch != 'main'
    steps:
      - name: Tests failed on a PR branch
        run: |
          echo "::error::Tests failed for commit ${{ github.event.workflow_run.head_sha }} on branch '${{ github.event.workflow_run.head_branch }}'."
          echo "Fix the failing tests before requesting merge to main."
          exit 1

  # Gate 2: owner approval (existing behaviour, unchanged)
  check-approval:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.base.ref == 'main')
    steps:
      - name: Require the repo owner's approval
        uses: actions/github-script@v6
        with:
          script: |
            const targetUser = 'Theodore-Gara';
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const ownerReviews = reviews.filter(r => r.user.login === targetUser);
            const latest = ownerReviews[ownerReviews.length - 1];
            if (!latest || latest.state !== 'APPROVED') {
              core.setFailed(`This PR is NOT approved by @${targetUser}. Ask ${targetUser} to review before merging.`);
            }
            core.info(`Latest review from @${targetUser}: ${latest ? latest.state : 'none'}`);
