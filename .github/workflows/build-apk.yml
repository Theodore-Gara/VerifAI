name: APK build

# Builds the VerifAI release APK when:
# 1. Code is pushed to any branch (feature/fix/chore work + merges to main)
# 2. A pull request is opened/updated against main (so build breakage is caught before merging)
# 3. Manually, from the Actions tab
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build VerifAI APK (release)
    runs-on: ubuntu-latest
    # Skip cleanly until mobile code exists
    if: ${{ hashFiles('mobile/pubspec.yaml') != '' }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VerifAI-APK
          # upload-artifact resolves paths relative to the repo root (defaults.run
          # working-directory only applies to `run:` steps), so this must include mobile/.
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  apk-summary:
    name: APK build summary
    runs-on: ubuntu-latest
    needs: [build-apk]
    if: ${{ always() }}
    steps:
      - name: Check job results
        run: |
          results=(
            "build-apk:${{ needs.build-apk.result }}"
          )
          failed=0
          for entry in "${results[@]}"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            echo "$job → $result"
            case "$result" in
              failure|cancelled)
                echo "❌ $job failed"
                failed=1
                ;;
            esac
          done
          exit $failed
