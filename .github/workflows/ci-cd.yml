name: CI/CD Pipeline

# One workflow per push/PR. Runs on:
# 1. Push to any branch
# 2. PR opened/updated against main
# 3. Manual trigger
#
# Tests and build only. The Railway deploy lives in deploy-railway.yml and is
# triggered by this workflow finishing on main, so no deploy job appears on
# feature branches or PRs.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────────
  # BACKEND: Lint, test, audit
  # ──────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint || echo "::warning::No lint script or issues found"

      - name: Run tests
        run: |
          if npm run | grep -qE '^\s*(test|test:ci)\s*$'; then
            npm test
          else
            echo "No test script defined — skipping"
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=high || echo "::warning::High/critical vulnerabilities found"

  # ──────────────────────────────────────────────
  # MOBILE: Format, analyze, test
  # ──────────────────────────────────────────────
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      # Non-fatal: the Dart files still need reformatting, but that is mobile
      # work tracked on the mobile branch, not a merge blocker here.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Some Dart files are not formatted yet"

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory — skipping"
          fi

  # ──────────────────────────────────────────────
  # SECRET SCANNING
  # ──────────────────────────────────────────────
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks uploads a SARIF report and, on pull_request events, reads the PR
    # commit list. Without these it 403s with "Resource not accessible by
    # integration".
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # APK BUILD
  # ──────────────────────────────────────────────
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [mobile]
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VerifAI-APK
          # upload-artifact resolves paths relative to the repo root
          # (defaults.run working-directory only applies to `run:` steps), so this
          # must include mobile/.
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  # ──────────────────────────────────────────────
  # SUMMARY
  # ──────────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [backend, mobile, security, build-apk]
    if: always()
    steps:
      - name: Summary
        run: |
          results=(
            "Backend:${{ needs.backend.result }}"
            "Mobile:${{ needs.mobile.result }}"
            "Secret scan:${{ needs.security.result }}"
            "Build APK:${{ needs.build-apk.result }}"
          )
          failed=0
          for entry in "${results[@]}"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            echo "$job → $result"
            case "$result" in
              failure|cancelled) echo "❌ $job failed"; failed=1 ;;
            esac
          done
          exit $failed
