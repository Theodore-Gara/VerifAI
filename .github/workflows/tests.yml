name: Tests

# Runs when:
# 1. Code is pushed to any branch (feature/fix/chore work + merges to main)
# 2. A pull request is opened/updated against main (review + summary on the PR)
# 3. Manually, from the Actions tab
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: |
          if npm run | grep -qE '^\s*(test|test:ci)\s*$'; then
            npm test
          else
            echo "No test script defined in backend/package.json yet — skipping."
          fi

  mobile-tests:
    name: Mobile tests (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Some Dart files are not formatted yet"

      - name: Analyze code
        run: flutter analyze || echo "::warning::Analyzer reported issues — failing test runs will surface them"

      - name: Run tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory in mobile/ yet — skipping."
          fi

  security-tests:
    name: Security tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependency vulnerability audit (backend)
      - name: Audit backend dependencies
        working-directory: backend
        if: ${{ hashFiles('backend/package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock-only
          fi
          # Fail on high/critical vulnerabilities
          npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities — review them before merge"

      # Secret scanning: blocks pushes/PRs containing leaked API keys, tokens, passwords
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests-summary:
    name: Tests summary
    runs-on: ubuntu-latest
    needs: [backend-tests, mobile-tests, security-tests]
    if: ${{ always() }}
    steps:
      - name: Check job results
        run: |
          results=(
            "backend-tests:${{ needs.backend-tests.result }}"
            "mobile-tests:${{ needs.mobile-tests.result }}"
            "security-tests:${{ needs.security-tests.result }}"
          )
          failed=0
          for entry in "${results[@]}"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            echo "$job → $result"
            case "$result" in
              failure|cancelled)
                echo "❌ $job failed"
                failed=1
                ;;
            esac
          done
          exit $failed
