name: verifai
description: AI Workplace Readiness App - Flutter Mobile App
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  dio: ^5.4.0
  flutter_riverpod: ^2.6.1
  riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.0

  # Firebase
  # firebase_core 4.x / firebase_auth 6.x support Swift Package Manager and use
  # modular headers, which fixes the iOS "Include of non-modular header inside
  # framework module" build error with Xcode 26+.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  # Keep google_sign_in on 6.x: 7.x switched to the singleton/authenticate() API
  # and would break the existing GoogleSignIn(...).signIn() code.
  google_sign_in: ^6.1.6

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  path_provider: ^2.1.4

  # UI
  cupertino_icons: ^2.0.0
  fl_chart: ^0.65.0
  flutter_markdown_plus: ^1.0.12
  shimmer: ^3.0.0

  # Code generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

  # Fonts are bundled, never fetched. Runtime fetching meant the first paint used
  # a fallback family and then reflowed once the download finished, and left
  # typography dependent on a network call. Both families are SIL OFL 1.1; the
  # licence texts sit next to the files.
  #
  # Inter and Manrope ship as variable fonts upstream, so the static weights below
  # are instanced from the official variable sources (opsz pinned at 14 for
  # Inter). Regenerate with fontTools if the upstream files change.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

# Regenerate with: dart run flutter_launcher_icons
# The two source images are built by tool/generate_icon_sources.ps1 from the
# logo artwork, which ships as transparent art on a non-square canvas.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#061810"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The foreground is already fitted to the safe circle by
  # tool/generate_icon_sources.ps1, so the tool must not pad it a second time.
  # Its default of 16% would shrink the logo to roughly half the safe zone,
  # and it is not enough on its own anyway: the logo is wider than it is tall,
  # so its corners fall outside a circular mask at that scale.
  adaptive_icon_foreground_inset: 0
  # The project targets Android 11 (API 30), so every device uses the adaptive
  # icon in mipmap-anydpi-v26 and the legacy PNGs are only a fallback.
  min_sdk_android: 26
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0E1B2A"
    theme_color: "#0E1B2A"
