openapi: 3.0.3
info:
  title: VerifAI API
  version: 2.0.0
  description: Backend API for the VerifAI AI Workplace Readiness App.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://YOUR-RAILWAY-DOMAIN
    description: Replace with the team's Railway URL
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: FirebaseIDToken
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        request_id: { type: string }
    AttemptRequest:
      type: object
      properties:
        practice: { type: boolean, description: 'Record as a practice run (0 XP, no skill-score change)' }
        rationale: { type: string, maxLength: 10000 }
        answer_option_id: { type: integer, minimum: 1, description: 'Verification choice task' }
        decision_option_id: { type: integer, minimum: 1, description: 'Judgement / Risk & Governance' }
        reason_option_id: { type: integer, minimum: 1 }
        answer: { type: string, minLength: 1, maxLength: 10000, description: 'Legacy verification line_text task' }
        reason: { type: string, maxLength: 10000 }
        selected_lines: { type: array, items: { type: integer, minimum: 1 } }
      oneOf:
        - required: [answer_option_id]
        - required: [decision_option_id]
        - required: [answer]
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200': { description: API and database are healthy }
        '503': { description: Database unavailable }
  /api/auth/sync:
    post:
      summary: Synchronize Firebase user with PostgreSQL
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User synchronized }
        '401': { description: Invalid Firebase token }
  /api/users/me:
    get:
      summary: Get current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User profile }
        '401': { description: Unauthorized }
        '404': { description: User not synchronized }
  /api/users/profile:
    put:
      summary: Update current user profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 255 }
                industry_track_id: { type: integer, minimum: 1 }
      responses:
        '200': { description: Profile updated }
        '400': { description: Validation error }
  /api/tracks:
    get:
      summary: List industry tracks
      responses:
        '200': { description: Track list }
  /api/tasks/next:
    get:
      summary: Get next unseen task
      security: [{ bearerAuth: [] }]
      parameters:
        - name: feature
          in: query
          schema: { type: string, enum: [verification, judgement, risk_governance, prompt_design], default: verification }
          description: Restrict to a feature.
        - name: dimension
          in: query
          schema: { type: string }
          description: Display-name alias for feature (Verification, AI Judgement, Risk & Governance, Prompt Design). Must agree with feature.
      responses:
        '200': { description: Task or null when the track has no unseen tasks }
        '400': { description: Track selection required / unknown or conflicting dimension }
        '401': { description: Unauthorized }
  /api/tasks/{id}/attempt:
    post:
      summary: Submit and score a task answer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptRequest' }
      responses:
        '201': { description: Attempt scored and progress updated }
        '400': { description: Validation error }
        '403': { description: Task does not belong to selected track }
        '404': { description: Task or user not found }
  /api/progress/me:
    get:
      summary: Get current progress
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Progress summary }
  /api/achievements/me:
    get:
      summary: Get earned achievements
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Earned achievements }
  /api/interview/questions:
    get:
      summary: List the interview question bank for the user's track
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Question bank with practiced flags }
        '400': { description: Track selection required (or track not synchronised) }
        '401': { description: Unauthorized }
  /api/interview/questions/{id}/practice:
    post:
      summary: Mark an interview question as practised (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Question marked practised; readiness recomputed }
        '400': { description: Invalid id }
        '403': { description: Question does not belong to the user's track }
        '404': { description: Question not found }
  /api/meta:
    get:
      summary: Verification limits, accepted formats, tour version and contact rate limit
      responses:
        '200': { description: Meta document (ETag-cached; 304 on revalidation) }
  /api/support/help:
    get:
      summary: Published help articles (public)
      parameters:
        - { name: category, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Articles, categories and content version (ETag) }
  /api/support/help/{slug}:
    get:
      summary: One help article with related articles (public)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Article }
        '404': { description: help_article_not_found }
  /api/support/faqs:
    get:
      summary: Published FAQs, filterable by topic and searchable (public)
      parameters:
        - { name: topic, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: FAQs, topics and content version (ETag) }
  /api/support/industry-guides:
    get:
      summary: Industry guide summaries (public)
      responses:
        '200': { description: Guides and content version (ETag) }
  /api/support/industry-guides/{slug}:
    get:
      summary: Full industry guide with resolved related FAQs (public)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Guide }
        '404': { description: industry_guide_not_found }
  /api/support/about:
    get:
      summary: About page content, contact details and app version (public)
      responses:
        '200': { description: About content (ETag) }
  /api/support/tour:
    get:
      summary: Tour manifest; global, or global plus an industry's steps (public)
      parameters:
        - { name: track, in: query, required: false, schema: { type: string }, description: Guide slug or track id }
      responses:
        '200': { description: Manifest with autoplay false and a transcript on every step }
        '404': { description: track_not_found }
  /api/support/contact:
    post:
      summary: Send a support message (public; linked to the account when signed in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, message, category]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                subject: { type: string, minLength: 3, maxLength: 150 }
                message: { type: string, minLength: 10, maxLength: 4000 }
                category: { type: string, enum: [bug, account, content, verification, feedback, other] }
                app_version: { type: string, maxLength: 40 }
                website: { type: string, description: Honeypot; leave empty }
      responses:
        '201': { description: Ticket reference and expected reply time }
        '400': { description: Validation error with a code }
        '429': { description: Rate limited (5 per hour) }
  /api/support/events:
    post:
      summary: Record one allowlisted support analytics event (best effort)
      responses:
        '202': { description: Accepted; recorded false if the write was dropped }
        '400': { description: invalid_event or invalid_target }
  /api/roadmap:
    get:
      summary: Milestone tracker for the active (or ?track=) industry
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: track, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Stages, milestones with evidence, next action and credential state }
        '400': { description: invalid_track or track_required }
        '404': { description: track_not_found }
  /api/admin/support/help:
    get:
      summary: All help articles incl. unpublished (moderator+)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Articles }
  /api/admin/support/help/{id}:
    put:
      summary: Edit or publish/unpublish a help article (admin+; audited)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated article and a change summary }
        '400': { description: Validation error }
        '403': { description: Admin role required }
        '404': { description: Not found }
  /api/admin/support/faqs:
    get:
      summary: All FAQs incl. unpublished (moderator+)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: FAQs }
  /api/admin/support/faqs/{id}:
    put:
      summary: Edit or publish/unpublish an FAQ (admin+; audited)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated FAQ and a change summary }
  /api/admin/support/messages:
    get:
      summary: Contact inbox, filter by status and category (moderator+)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Messages, total, limit, offset }
  /api/admin/support/messages/{id}:
    put:
      summary: Set a message status and/or internal note (admin+; audited)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated message }
  /api/admin/support/insights:
    get:
      summary: Support analytics over a window (moderator+)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200': { description: Top articles, FAQ topics, no-result search rate, tour skip rate, contact volume }
